# ========================================
# INFORMACIÓN ADICIONAL DEL LAB
# ========================================
# 
# ONTAP Cluster: cluster1 (v9.14.1)
# Storage VM (SVM): nassvm
# Protocol: NFS (NFSv3/v4)
# 
# Aggregates:
#   - aggr1: Spinning media (HDD) en cluster1-01
#   - aggr2: SSD media en cluster1-01
# 
# QoS Policies disponibles:
#   - qa: Traditional QoS, max 500MB/s, non-shared
#   - extreme: Adaptive QoS para tier Gold
#   - performance: Adaptive QoS para tier Silver  
#   - value: Adaptive QoS para tier Bronze
# 
# Export Policies:
#   - default: Política de exportación predeterminada
#   - auto: Para autoExportPolicy (CIDR: 192.168.0.0/24)
# 
# Topología Kubernetes:
#   - Region: us-east1
#   - Zones: us-east1-a, us-east1-b, us-east1-c
#   - Nodes: rhel1 (worker), rhel2 (worker), rhel3 (control-plane)
# 
# Backends Trident del Lab:
#   - BackendForNFS: ontap-nas driver
#   - BackendForiSCSI: ontap-san driver (SVM: sansvm)
#   - BackendForSMB: ontap-nas driver (SMB/CIFS)
# 
# CÓMO USAR ESTE SECRET:
# 1. Verifica que el nombre coincida con config.yaml (credentials.name)
# 2. Elige autenticación: usuario/password O certificados (no ambos)
# 3. Aplica: kubectl apply -f secret.yaml
# 4. Verifica: kubectl get secret trident-creds -n trident
# 5. Ejecuta el generador: python generate_trident_nas.py
# 6. Aplica backend: kubectl apply -f backend_storage.yaml
# 
# VERIFICACIÓN:
# kubectl get tridentbackendconfig -n trident
# kubectl get storageclass
# tridentctl get backend -n trident
