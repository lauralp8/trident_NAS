# ================================================================================
# SECRET - Credenciales de NetApp ONTAP para Trident
# ================================================================================
# 
# IMPORTANTE: Este archivo contiene información sensible. NO lo subas a repositorios públicos.
# 
# OPCIÓN 1: Autenticación con Usuario y Contraseña (más común)
# Descomenta las líneas de username y password, y comenta los certificados.
# 
# OPCIÓN 2: Autenticación con Certificados (más segura para producción)
# Descomenta las líneas de certificados y comenta username/password.
# 
# El nombre del Secret (metadata.name) debe coincidir con credentials.name en config.yaml
# ================================================================================

apiVersion: v1
kind: Secret
metadata:
  name: trident-creds
  namespace: trident
type: Opaque
stringData:
  # === AUTENTICACIÓN CON USUARIO/CONTRASEÑA ===
  username: vsadmin
  password: Netapp1!
  
  # === AUTENTICACIÓN CON CERTIFICADOS (opcional) ===
  # Descomenta y completa si usas autenticación basada en certificados.
  # Reemplaza <CONTENIDO> con el contenido real de tus archivos PEM.
  
  # clientCertificate: 
  
  # clientPrivateKey:
  
  # trustedCACertificate:
