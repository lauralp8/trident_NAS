# IMPORTANTE: Este archivo contiene información sensible. NO lo subas a repositorios públicos.
# 
# Basado en NetApp Lab "Astra Trident Advanced Features" v6.0
# Lab Environment: https://labondemand.netapp.com/lab/sl11019
# 
# OPCIÓN 1: Autenticación con Usuario y Contraseña (recomendada para desarrollo/testing)
# OPCIÓN 2: Autenticación con Certificados (recomendada para producción)
# 
# El nombre del Secret (metadata.name) debe coincidir con credentials.name en config.yaml
# ================================================================================

apiVersion: v1
kind: Secret
metadata:
  name: trident-creds
  namespace: trident
type: Opaque
stringData:
